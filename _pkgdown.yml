url: https://ecool50.github.io/dioscRi

template:
  bootstrap: 5

navbar:
  structure:
    left:  [intro, articles, reference, news]
    right: [search, github]
  components:
    intro:
      text: Get started
      href: articles/dioscRi_quickstart.html
    articles:
      text: Articles
      menu:
      - text: Quickstart (toy data)
        href: articles/dioscRi_quickstart.html
      - text: BioHEART-CT walkthrough (unsupervised)
        href: articles/dioscRi_introduction.html
      - text: BioHEART-CT walkthrough (manual gating)
        href: articles/dioscRi_manual_gating.html
      - text: Adding clinical covariates
        href: articles/dioscRi_with_clinical.html

reference:
- title: Reference sample selection and MMD-VAE normalisation
  desc: >
    Identify samples whose covariance structure is most central to the
    cohort, then train an MMD-VAE for domain adaptation across batches
    and apply it to new samples.
  contents:
  - computeReferenceSample
  - trainVAEModel
  - decodeSamples

- title: Cell-type classification
  desc: >
    Transfer cluster (or manually gated) cell-type labels from training
    to test data using the MMD-VAE latent representation.
  contents:
  - trainCellTypeClassifier

- title: Sample-level features and hierarchy
  desc: >
    Summarise each sample as cell-type proportions and per-cell-type
    marker means, then build the cell-type hierarchy that defines
    overlapping groups for the lasso.
  contents:
  - computeFeatures
  - generateTree
  - generateGroups
  - findChildren

- title: Modelling
  desc: >
    Fit the overlapping group lasso over the cell-type hierarchy.
  contents:
  - fitModel

- title: Interpretation and visualisation
  desc: >
    Evaluate predictions, surface significant features, and visualise
    the learned cell-type hierarchy.
  contents:
  - plotAUC
  - plotSigFeatures
  - visualiseModelTree
  - getSigFeatures

- title: Bundled example data
  desc: Toy datasets used by the quickstart vignette and function examples.
  contents:
  - sample_markers
  - sample_cytof_data
  - sample_cytof_sce
  - sample_clinicaldata
  - sample_data_logit
  - sample_markerMeans
  - sample_groups
  - sample_tree

- title: internal
  contents:
  - batchCorrectOT
  - batchCorrectOTPerCluster
  - computeSlicedBarycenter
  - computeSlicedBarycenterAutograd
  - trainSWAEModel
  - trainSWAEClustering
  - trainSWAEClusteringFast
  - trainSWAEEnhanced
  - trainVQVAEClustering
  - encodeSWAE
  - decodeSWAE
  - getProp
  - plotElbow
  - computeCellImportance
